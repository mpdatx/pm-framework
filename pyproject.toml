[project]
name = "pm-framework"
version = "0.1.0"
description = "project-docs: a portable docs and work-status convention, tool and skill"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "markdown-it-py>=3.0", "pyyaml>=6.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tool", "tests"]
